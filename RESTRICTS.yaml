# RESTRICTS.yaml — 约束清单（必须严格遵守与复习）
#
# 来源：
#   1) 用户 2026-09-18 粘贴的论文流水线提示词中的「核心纪律与强制附加约束」段落
#      （原始粘贴件 ~/.zcode/tmp/paste-attachments/2026-09-18/pasted-text-20260918-222626-3fd0cf9f.txt）
#   2) 本仓库既有治理文件 agent.md 的「权威与证据」「模块边界」「变更与验证」
#
# 地位：与 agent.md、MEGA_PROMPT.md 并列的最高优先级约束。冲突时按 agent.md 的
#       「权威与证据」条判定，并按本文件 reporting.conflict_policy 记录。
#
# 复习时机（强制）：
#   - 每次会话开始
#   - 阶段 9（EXPERIMENT_DESIGN）开始前
#   - 阶段 16（PAPER_OUTLINE）/ 17（PAPER_DRAFT）开始前 —— 原文明确要求"必须重新复习写作约束"
#   - 阶段 20（QUALITY_GATE）与投稿前自查

version: "1.0"
instantiated_at: "2026-09-18"
project: iron-bottom-sound

# ---------------------------------------------------------------------------
# 0. 权威与证据
# ---------------------------------------------------------------------------
authority:
  precedence:
    - "想定特例 > 舰船记录/玩家辅助表 > 通用规则"
  evidence_rules:
    - "OCR 和文本抽取仅用于检索；表格、地图、炮位与射界必须回看原页或原图。"
    - "禁止猜测缺失的表格单元、修正、优先级或取整方式。不确定项必须写入 docs/rules/open_questions.md，并阻止对应自动裁决。"
    - "每条可执行规则必须具有稳定 rule_id、结构化数据、引擎调用点、事件轨迹和来源边界测试。"

# ---------------------------------------------------------------------------
# 1. 模块边界（本仓库）
# ---------------------------------------------------------------------------
module_boundaries:
  - "resources/originals/ 只保存不可修改的规范来源副本。"
  - "resources/derived/structured/ 保存可审查的规则、舰船、地图和想定数据。"
  - "backend/src/iron_bottom_sound/engine.py 是裁决入口；UI、API、存储和 LLM 不得复制规则常量。"
  - "UI、LLM 和未来强化学习环境只通过观察、合法行动和命令接口影响游戏。"
  - "对手隐藏单位和秘密计划不得进入非所属方的 API 响应、WebSocket、DOM 或日志。"

# ---------------------------------------------------------------------------
# 2. 计算与资源守卫（针对阶段 D & E）
# ---------------------------------------------------------------------------
compute_guard:
  mandatory_pilot:
    rule: "在运行任何主实验循环前，必须先运行 1 个条件的小规模 Pilot，在日志中打印 TIME_ESTIMATE: Xs 以推算总运行时间。"
    log_marker: "TIME_ESTIMATE:"
    required: true
  dynamic_scaling:
    - condition: "实验条件 > 100 组"
      action: "自动将随机种子（Seeds）次数降至 3-5 次"
      forbidden: "严禁强跑 20 次"
    - condition: "可用时间不足"
      action: "限制每轮优化步数上限（如 <= 5,000 步）"
  graceful_shutdown:
    rule: "代码必须包含 time_guard 逻辑，定期检查时间，在达到资源预算 80% 时强制停止并保存已收集的部分数据。"
    budget_fraction: 0.80
    function_name: time_guard
    required: true

# ---------------------------------------------------------------------------
# 3. 真实性代码红线（针对阶段 10 & 13）
# ---------------------------------------------------------------------------
authenticity_redlines:
  anti_hallucination:
    rule: "严禁使用 random.uniform() 或类似随机数生成器来伪造下降的 Loss 曲线或实验结果。"
    severity: CRITICAL
  real_math:
    rule: "必须使用 NumPy 矩阵运算实现真实的算法（如手动实现梯度计算或基于真实数据的交叉熵）。"
    severity: CRITICAL
  real_convergence_gate:
    rule: "必须实现真实的收敛停止准则（如连续 N 次迭代 Objective 变化 < 1e-8）。严禁仅仅使用固定的 for 循环而不做收敛检查。"
    tolerance: 1.0e-8
    severity: CRITICAL
  numerical_stability_no_bandaids:
    rule: "在 ITERATIVE_REFINE 时，如果遇到 NaN/Inf 或 RuntimeWarning，必须追踪根源（如：学习率过高、零除错误、未归一化），严禁单纯使用 try-except 或 np.nan_to_num() 来掩盖报错。"
    severity: CRITICAL
  forbidden_imports:
    - subprocess
    - os.system
    - eval
    - exec
    - shutil
    - socket

# ---------------------------------------------------------------------------
# 4. 顶会级论文构写标准（针对阶段 G）
# ---------------------------------------------------------------------------
writing_standards:
  review_before_writing:
    rule: "阶段 G 开始前必须重新复习本文件中的写作约束，尤其是字数长度和质量约束。"
    required: true
  sushi_not_curry:
    rule: "一篇好论文只有 1-2 个核心创新点（Novelty），其余部分保持极致的简洁和严谨。不要堆砌毫无关联的模块。"
  figure1_hegemony:
    rule: "必须在初稿前构思好图 1。图 1 必须能独立传达这篇论文的最核心贡献，并在 prompt 中为 Nano Banana 2 提供极为详尽的视觉元素描述。"
  mandatory_ablations:
    rule: "论文中提到的任何'有效组件'，代码中必须包含且论文中必须报告'移除该组件'后的对比数据。没有消融实验，直接拒绝进入下一步。"
    gate: hard
  strong_baselines:
    rule: "基线模型必须经过与你提出的方法同等精力的超参数调优。"
  word_count_defense:
    rule: "严守长度底线。如果字数不足，只能通过增加实质性的'研究空白分析'或'技术细节'扩写，严禁使用车轱辘话凑字数。"
    section_minimums:
      introduction: [800, 1000]
      method: [1000, 1500]
    main_body_total_target: [5000, 6500]
    main_body_critical_floor: 4000
    section_floors_for_review:
      abstract: 150
      introduction: 700
      related_work: 500
      method: 800
      experiments: 600
      results: 500

# ---------------------------------------------------------------------------
# 5. 证据与相关性红线审查（针对阶段 18 & 23）
# ---------------------------------------------------------------------------
evidence_redlines:
  methodology_evidence_consistency:
    rule: "必须将生成的论文 Draft 与 results.json 和实验 Log 逐行比对。"
    required: true
  critical_fabrication:
    rule: "如果论文声称跑了 10 种数据集而 log 显示只有 2 种；如果论文宣称执行了 T-test 但代码中没有实现，直接判定为 CRITICAL FABRICATION（重大伪造），强制退回实验阶段。"
    examples:
      - "论文声称 N 次试验但代码显示不同数目"
      - "论文声称做了统计检验（ANOVA/t-test）但代码中没有"
      - "论文报告了实际结果中不存在的指标"
      - "论文描述了代码中未实现的方法"
    verdict: CRITICAL_FABRICATION
    action: "强制退回实验阶段（REFINE -> 阶段 13）"
  trial_count_consistency:
    rule: "论文声称的试验次数必须与实际运行次数一致。声称'100 次独立试验'而实际只跑 1 次 = CRITICAL fabrication，必须修正。"
  literature_fidelity:
    rule: "提取的文献卡片必须保留原版的 cite_key 和 DOI。拒绝对本领域毫无关联的论文（哪怕它本身是高质量的顶会）。"
  citation_source_rules:
    - "所有引用文献必须在网上真实查找到，不能编造数据或文献。"
    - "优先引用顶会论文，数量至少 30 篇。"
    - "论文年份须晚于 {min_year}（槽位待用户确认）。"

# ---------------------------------------------------------------------------
# 6. 环境与库兼容性规范（针对阶段 10）
# ---------------------------------------------------------------------------
environment_compat:
  sandbox_dependencies:
    rule: "优先使用 Python stdlib, numpy, math, statistics。在非必要情况下（即纯算法创新时），禁止强行引入庞大的深度学习框架。"
  numpy_2x_compat:
    severity: CRITICAL
    replacements:
      - deprecated: "np.trapz"
        use: "np.trapezoid"
      - deprecated: "np.erfinv"
        use: "scipy.special.erfinv"
      - deprecated: "np.bool / np.int / np.float / np.complex"
        use: "Python 原生类型 bool / int / float / complex"
      - deprecated: "np.str / np.object"
        use: "str / object"
      - deprecated: "np.math"
        use: "标准库 math"
  environment_reversibility:
    rule: "任何环境配置必须可逆，或在虚拟环境中完成，避免对系统环境造成不可逆影响。建议使用 venv 或 conda，或 Docker 隔离。"
  environment_recording:
    rule: "必须在 PROGRESS.md 中记录每次环境配置的细节（requirements.txt、版本号、环境变量等）。"
  secrets:
    rule: "不得把 API 密钥、访问令牌、用户秘密或模型私有推理写入仓库或事件日志。"
    severity: CRITICAL

# ---------------------------------------------------------------------------
# 7. 硬主题约束（HARD TOPIC CONSTRAINT）
# ---------------------------------------------------------------------------
topic_constraint:
  topic: "历史依赖博弈中的预算化重规划与认证价值前沿（Budgeted Replanning in History-Dependent Games: Certified Value Frontiers for Revision Calendars）"
  prohibited:
    - "不得把环境搭建、依赖安装或基础设施故障当作研究贡献。"
    - "不得把调试日志、系统错误或配置问题当作实验发现。"
    - "不得漂移到与既定主题无关的周边话题。"
    - "每一节都必须回到核心研究问题。"
    - "Abstract 与 Introduction 必须明确陈述由 {topic} 导出的研究问题。"
    - "Method 必须描述技术方法，而不是工作流。"
    - "Results 必须报告实验的定量结果，而不是环境状态。"

# ---------------------------------------------------------------------------
# 8. 流水线流程约束
# ---------------------------------------------------------------------------
pipeline_constraints:
  gates: [5, 9, 20]
  gate_policy:
    pause_for_human: true
    auto_approve_flag: "--auto-approve"
    on_reject: "流水线回滚"
  decision_loops:
    - from: 15
      to: [13, 8]
      modes: [REFINE, PIVOT]
      auto_versioning: true
    - from: 25
      to: [13, 16]
      modes: [REFINE_for_experiments, PIVOT_for_paper]
      auto_versioning: true
  mandatory_loop_count_min: 2
  stage_exit_recheck: "每个 stage 结束时重新检查"
  planning:
    rule: "每个阶段开始前必须创建对应的计划文件。"
    home: "PROGRESS.md（阶段级）+ plan.md（批次级）"
  traceability:
    rule: "阶段结束后必须在 PROGRESS.md 记录产物摘要并标记已完成；记录版本号与变化点。"
  commit_policy:
    rule: "代码和论文草稿放入 Git，每个阶段结束后提交一次并记录提交信息。"
  experiment_count_min: "10-15 轮不同条件"
  report_gates_as_gates: "未触发的扩展项不得报为已通过；失败分支按失败记录。"

# ---------------------------------------------------------------------------
# 9. 报告纪律（红线）
# ---------------------------------------------------------------------------
reporting:
  verdicts_are_binary_at_gates: true
  no_claim_substitution: "不得用'任务完成'替代'科学结论成立'。"
  no_fabricated_review: "不得伪报独立同行评审或质量认证。"
  unresolved_must_be_labeled: "未分辨、域外状态、负结果与零漂移必须保留并标注。"
  conflict_policy: "冲突时以 agent.md 的权威优先级判定，并在 PROGRESS.md 登记冲突与裁定。"
  negative_results_kept: "科学负结果不改变原设计，但必须完整报告。"

# ---------------------------------------------------------------------------
# 10. 槽位（待用户确认，禁止自行编造）
# ---------------------------------------------------------------------------
pending_slots:
  target_conference: null      # <目标会议名称>
  submission_deadline: null    # <截稿日期及时间>
  page_limit: null             # <限制页数>
  min_reference_year: null     # <指定年份>
  openai_api_base: null        # OPENAI_API_BASE
  openai_api_key: null         # 由用户注入环境，不入库
  kaggle_api_token: null
  tavily_api_key: null
  optional_models: null        # <模型1..4>
