[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iron-bottom-sound"
version = "0.1.0"
description = "Auditable Iron Bottom Sound IV wargame engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.6",
  "Pillow>=10",
  "PyYAML>=6.0",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6"]
corpus = ["pypdf>=5", "python-docx>=1.1", "openpyxl>=3.1", "pypdfium2>=4.30", "rapidocr>=3.9", "onnxruntime>=1.29"]

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
