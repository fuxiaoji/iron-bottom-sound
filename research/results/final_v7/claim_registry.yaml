- claim: formation-level wording consistency
  evidence: v7 mandate — every reduced model interpreted as formation reference
    state; payoff aggregated over formation vessels (F_i = sum_k K_ik)
  assumptions: rigid/quasi-rigid line-ahead formations; no formation deformation
  numerical_method: formation DO (MUST-1) and 3v3 engine scenarios (MUST-2)
  convergence_status: paper-wide sweep (paper_v7/main.tex)
