# 铁底湾 /tiedi 部署 —— 追加到 fuwenji.asia 现有 server 块内（纯增量，不影响首页作品集）。
#
# 方式：单个反向代理块，把整个 /tiedi 树交给后端单进程托管。后端本身会
# （1）把 /api 前缀剥掉（_strip_api_prefix 中间件）、（2）把 frontend/dist 挂在
# 根路径（StaticFiles html=True）——因此静态页、JS/CSS、/api、/assets/counters
# 棋子图、战报截图全部由这一个块覆盖，无需为静态单独配 location。
#
# 前提：
#   - 仓库位于 /opt/tiedi；后端 systemd 服务 tiedi 监听 127.0.0.1:8001
#   - 前端已构建：cd /opt/tiedi/frontend && npm install && npm run build -- --base=/tiedi/
#     （api.ts/assets.ts 用 import.meta.env.BASE_URL 自动派生 /tiedi/api 与 /tiedi/assets/counters）
#
# 校验：nginx -t && systemctl reload nginx

# /tiedi 不带斜杠 → 301 到 /tiedi/
location = /tiedi {
    return 301 /tiedi/;
}

location /tiedi/ {
    # 剥掉 /tiedi 前缀再转给后端：/tiedi/xx -> /xx
    rewrite ^/tiedi(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;   # LLM 对手回合 / 战报叙事可能超过默认 60s
    client_max_body_size 6m;
}
