# 铁底湾 /tiedi 部署 —— 追加到 fuwenji.asia 现有 server 块内（纯增量，不影响首页作品集）。
#
# 前提：
#   - 仓库位于 /opt/tiedi
#   - 前端已构建：cd /opt/tiedi/frontend && pnpm install && pnpm build -- --base=/tiedi/
#     （产物 /opt/tiedi/frontend/dist，index.html 内资源均以 /tiedi/ 开头）
#   - 后端 systemd 服务 tiedi 监听 127.0.0.1:8001（见 deploy/tiedi.service）
#   - nginx 现有 server 块的 root/其他 location 不受影响；/tiedi 前缀匹配优先级高于 /
#
# 校验：nginx -t && systemctl reload nginx

# ---- /tiedi 静态：已构建 SPA ----
location /tiedi/ {
    alias /opt/tiedi/frontend/dist/;
    index index.html;
    # 纯静态 + SPA 回退（刷新任意子路由都落到 index.html）
    try_files $uri $uri/ /tiedi/index.html;
}

# ---- /tiedi/api/* → 后端（去掉 /tiedi/api 前缀，后端路由即 /games、/scenarios 等）----
location /tiedi/api/ {
    rewrite ^/tiedi/api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;   # LLM 对手回合 / 战报叙事可能超过默认 60s
}

# ---- 棋子图片：后端静态挂载 /assets/counters（去掉 /tiedi 前缀）----
location /tiedi/assets/counters/ {
    rewrite ^/tiedi(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache_valid 200 302 24h;
}
