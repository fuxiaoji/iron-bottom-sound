<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鱼雷 AI · PSRO-lite 训练</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0a1214;color:#e8e0c9}body{margin:0;padding:28px;background:radial-gradient(circle at 15% 10%,#203a3d,#0a1214 52%)}main{max-width:1100px;margin:auto}h1{font:32px Georgia,serif;margin:0 0 8px;color:#f0d99f}.sub{color:#91a29e}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.card{border:1px solid #405250;background:#142124;padding:16px;box-shadow:0 12px 40px #0004}.card span{display:block;color:#8fa39d;font-size:12px}.card b{display:block;margin-top:8px;font-size:22px}.progress{height:16px;border:1px solid #536865;background:#0a1214}.progress i{display:block;height:100%;background:linear-gradient(90deg,#a78947,#e4c675);width:0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}section{border:1px solid #405250;background:#142124;padding:18px}h2{font:20px Georgia,serif;color:#d9c38e}table{width:100%;border-collapse:collapse}td{border-top:1px solid #344543;padding:8px}.bar{height:8px;background:#263637}.bar i{display:block;height:100%;background:#7eb097}code{color:#e0bd72}.error{color:#ff9b8e;white-space:pre-wrap}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}</style></head><body><main><h1>自适应鱼雷 AI · PSRO-lite</h1><p class="sub">断电安全训练面板 · 主验收槽位：<b id="primary">—</b> · 每秒刷新</p><div class="grid"><div class="card"><span>阶段</span><b id="stage">连接中</b></div><div class="card"><span>轮次</span><b id="round">—</b></div><div class="card"><span>完成对局</span><b id="games">—</b></div><div class="card"><span>预计剩余</span><b id="eta">—</b></div></div><div class="progress"><i id="progress"></i></div><div class="layout"><section><h2>策略混合分布</h2><table id="mixture"></table></section><section><h2>当前最佳响应</h2><pre id="best">—</pre><h2>断电恢复</h2><code>python -m rl.psro --out &lt;目录&gt; --resume --serve-dashboard</code><p class="error" id="error"></p></section></div></main><script>
const fmt=s=>{if(!Number.isFinite(s)||s<=0)return '计算中';const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}时${m}分`:`${m}分`};async function tick(){try{const r=await fetch(`status.json?t=${Date.now()}`);const d=await r.json();stage.textContent=d.stalled?`${d.stage}（疑似停滞）`:d.stage;round.textContent=d.round;games.textContent=`${d.completed_games} / ${d.expected_games}（有效 ${d.valid_games??0}，无效 ${d.invalid_games??0}）`;eta.textContent=fmt(d.eta_seconds);primary.textContent=d.primary_scenario;progress.style.width=`${(d.progress*100).toFixed(1)}%`;mixture.innerHTML=Object.entries(d.meta_distribution||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${k}</td><td>${(v*100).toFixed(1)}%</td><td><div class=bar><i style="width:${v*100}%"></i></div></td></tr>`).join('')||'<tr><td>收益矩阵尚未完成</td></tr>';best.textContent=JSON.stringify(d.current_best,null,2);const stalled=d.stalled?`已有 ${fmt(d.progress_age_seconds)} 没有新对局完成；训练心跳仍在线，请检查工作进程。`:'';error.textContent=[stalled,d.status_write_error||'',d.last_error||''].filter(Boolean).join('\n')}catch(e){stage.textContent='等待训练进程'}setTimeout(tick,1000)}tick();
</script></body></html>
