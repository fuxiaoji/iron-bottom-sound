status: structured
note: 舰级卡为同一舰级共用数据（代表舰标注在卡面，source_page=1 指卡正面）；仅用于解锁目录中无独立舰卡记录的舰，同名同型已有记录的目录行视为替身不重复登记，记录手册优先。卡面上 0 火力的高炮位（无水面火力）不录入引擎。绫波级（夕雾）无独立舰级卡保持未建档；巴格莱级/本汉姆级/波特级/利安德级/爪哇级/德·鲁伊特/哈津斯级无舰级卡。
