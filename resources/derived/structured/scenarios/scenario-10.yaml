# S-10 萨沃岛海战（1942年8月9日）
# 页面：/tmp/ibs-render/scen-10.png（PDF第10页，印刷页码11）
# 注意：页面只有“日本舰队 配置”一个配置框，没有盟军舰队配置表；
#       盟军突袭规则中提及“堪培拉”“芝加哥”“巴格莱”“帕特森”，但盟军部署数据在本页缺失。
id: IBS-S-10
number: 10
title: 萨沃岛海战
date: 1942-08-09
status: playable
source: {document: scenario-book-zh.pdf, pdf_page: 10, printed_page: 11, status: verified_source}
turns: 30  # 页面为“无限回合”（见 IBS-S-10-R4）；30 为引擎整回合并上界，非规则值
visibility: {axis: 16, allies: 8}
optional_rules: []
available_optional_rules: [hidden_contacts, radar, star_shells, searchlights, malfunction_66, squalls, smoke, silhouettes, hidden_damage, blind_torpedoes]
initial_phase: gunnery
setup:
  mode: scenario_positions
  engine_default_note: engine_default_formations 仅为真实模式直接开局的默认编队提案；部署权威仍是 ships 初始位置与想定规则。
  engine_default_formations:
    axis:
    - id: axis-cruiser-column
      role: line_ahead
      ships:
      - IBS-U-IJN-CHOKAI
      - IBS-U-IJN-AOBA
      - IBS-U-IJN-KAKO-I
      - IBS-U-IJN-KINUGASA
      note: 外南洋巡逻部队主力单纵（三川军一少将旗舰鸟海）
    - id: axis-following
      role: line_ahead
      ships:
      - IBS-U-IJN-FURUTAKA
      - IBS-U-IJN-TENRYU
      - IBS-U-IJN-YUBARI
      - IBS-U-IJN-XIFENG
      note: 后续追击队（按R1跟随衣笠）
    allies:
    - id: allies-southern-force
      role: line_ahead
      ships:
      - IBS-U-RAN-CANBERRA
      - IBS-U-USN-UNNAMED-T01-R12
      - IBS-U-USN-PATTERSON
      - IBS-U-USN-BAGLEY
      - IBS-U-USN-JARVIS
      note: 南方舰队（克拉奇利少将旗舰澳大利亚在增援）
    - id: allies-northern-force
      role: line_ahead
      ships:
      - IBS-U-USN-VINCENNES
      - IBS-U-USN-QUINCY
      - IBS-U-USN-ASTORIA
      - IBS-U-USN-WILSON
      - IBS-U-USN-HELM
      note: 北方舰队

victory:
  kind: score_threshold_tiers
  tactical_margin: 16
  decisive_margin: 50
special_rules:
  # 配置框内注释原文
  - {id: IBS-S-10-R1, text: '“天龙”，“夕张” & “夕凪” 排成一列依次跟随“衣笠”（领头），这三艘舰船到达时每艘船占据一个格子。'}
  - {id: IBS-S-10-R2, text: 将萨沃岛小地图的X格对应放置在A20格。}
  - {id: IBS-S-10-R3, text: 第1回合时，日军16格，盟军8格。第2回合时，盟军提高到10格。第3回合开始盟军提高到12格。}
  - {id: IBS-S-10-R4, text: 无限回合，当所有日军单位从地图A27-HH27离开地图时游戏结束。}
  - {id: IBS-S-10-R5, text: 第1回合从炮击执行阶段开始，移动已经结束。只有日军在第1回合可以炮击。}
  # 盟军突袭规则
  - {id: IBS-S-10-R6, text: 在第1回合开始，唯一警戒状态的是盟军南方编队，其他所有盟军单位都是未警戒状态。}
  - {id: IBS-S-10-R7, text: 未警戒的单位只能保持原有方向和航速直行。}
  - {id: IBS-S-10-R8, text: 警戒状态的单位第一回合无法炮击，但第二回合可以正常炮击。“堪培拉”，“芝加哥”，“巴格莱” 和 “帕特森” 四艘单位第1回合无法炮击，并且每回合航速只能提升1MF。}
  - {id: IBS-S-10-R9, text: 当单位达成下列条件之一时，会转换成警戒状态：1，被炮击一次，无论是否被命中。2，被鱼雷命中一次。3，敌舰在可视范围内。}
  - {id: IBS-S-10-R10, text: 第3回合开始，全部单位自动转换成警戒状态。}
  - {id: IBS-S-10-R11, text: 在第一回合的炮击执行阶段前，日军可以在地图上放置一枚（飞机投放）的闪光弹。}
  # 日军分数奖励
  - {id: IBS-S-10-R12, text: 日军单位可以从HH1至HH16格离开地图，每离开一艘单位日军获得1分。}
  - {id: IBS-S-10-R13, text: 离开地图前，每消耗1点鱼雷值获得4分。}
  - {id: IBS-S-10-R14, text: 离开地图的单位可以在下回合从离开格的3格范围内返回地图。}
  # 胜利条件
  - {id: IBS-S-10-R15, text: 如果日军比盟军多16分，日军获得战术胜利。}
  - {id: IBS-S-10-R16, text: 如果日军比盟军多50分，日军获得决定性胜利。}
  - {id: IBS-S-10-R17, text: 如果分数差小于16分，盟军获得战术胜利。}
  - {id: IBS-S-10-R18, text: 如果击沉3艘日军重巡，且盟军分数多，则盟军获得决定性胜利。}
  - {id: IBS-S-10-R19, text: 其他情况为平局。}
  # 盟军增援（配置（旗舰：澳大利亚——维克托·克拉奇利少将），原文位于 PDF 第 11 页/印刷页 12）
  - {id: IBS-S-10-R20, text: 盟军玩家可能获得增援。第2回合开始，在日军移动阶段之前，掷2枚骰子，如果点数之和与下面表格对应的结果出现未上场的增援单位，将他们依次以警戒状态进入地图。盟军后续每回合都掷骰判定增援。骰点表：2=澳大利亚、东方部队、拉尔夫·托尔伯特；3=澳大利亚、东方部队、布鲁；4=澳大利亚、东方部队、布鲁；5-9=没有新部队转移或加入；10=澳大利亚；11=澳大利亚、拉尔夫·托尔伯特；12=拉尔夫·托尔伯特 & 布鲁。}
  - {id: IBS-S-10-R21, text: “澳大利亚”从地图HH22-HH27格进入地图（包含这两格），“拉尔夫·托尔伯特”从A1-A8进入地图（包含这两格），“布鲁”从A21-A27进入地图（包含这两格），东方编队从HH3-HH21进入地图（包含这两格）。上述单位可以以任何航速进入地图，东方编队以任意单位领头，单纵队进入地图。}
  - {id: IBS-S-10-R22, text: 如果日军单位离开地图，图拉吉护航编队可以进场。进场位置是离开地图的日军单位离开格的5格范围内，日军单位离开地图的2个回合后，图拉吉护航编队以任意航速进入。}
special_rule_kinds:
- id: IBS-S-10-R3
  kind: visibility_schedule
  side: allies
  from_turn:
    '1': 8
    '2': 10
    '3': 12
- id: IBS-S-10-R5
  kind: turn_restriction
  sides:
  - allies
  turns:
  - 1
  actions:
  - gunnery
  reason: 想定特例：只有日军在第 1 回合可以炮击
- id: IBS-S-10-R6
  kind: alert_states
  sides:
  - allies
  all_alerted_turn: 3
  initial:
    ships:
    - IBS-U-RAN-CANBERRA
    - IBS-U-USN-UNNAMED-T01-R12
    - IBS-U-USN-PATTERSON
    - IBS-U-USN-BAGLEY
    - IBS-U-USN-JARVIS
  speed_cap_ships:
  - IBS-U-RAN-CANBERRA
  - IBS-U-USN-UNNAMED-T01-R12
  - IBS-U-USN-PATTERSON
  - IBS-U-USN-BAGLEY
  note: 南方编队初始警戒；未警戒单位只能原向原速直行（R7）；4 舰每回合最多提速 1MF（R8）；被炮击/被雷命中/敌舰可视转警戒（R9）；第 3 回合全体警戒（R10）
- id: IBS-S-10-R13
  kind: torpedo_expenditure_points
  points_per_torpedo: 4
  note: 每消耗 1 点鱼雷值日军得 4 分（R13）；离场计分/返回见 R12/R14 文本（离场机制引擎暂未实现）

