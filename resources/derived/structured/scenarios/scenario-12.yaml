# S-12 布干维尔岛海战（第一战队出击！）（页面日期：1928年3月3日，架空想定，逐字照录页面日期）
# 页面：/tmp/ibs-render/scen-13.png（PDF第13页，印刷页码14；页面徽章 Scenario 12）
# 注：S-10萨沃岛海战跨两页（PDF第10-11页），故此后"PDF页码=想定编号+1"。
id: IBS-S-12
number: 12
title: 布干维尔岛海战（第一战队出击！）
date: 1928-03-03
status: playable
source: {document: scenario-book-zh.pdf, pdf_page: 13, printed_page: 14, status: verified_source}
turns: 9
visibility: {axis: 14, allies: 12}
optional_rules: []
available_optional_rules: [hidden_contacts, radar, star_shells, searchlights, malfunction_66, squalls, smoke, silhouettes, hidden_damage, blind_torpedoes]
setup:
  mode: scenario_positions
  engine_default_note: engine_default_formations 仅为真实模式直接开局的默认编队提案；部署权威仍是 ships 初始位置与想定规则。
  engine_default_formations:
    axis:
    - id: axis-main-body
      role: line_ahead
      ships:
      - IBS-U-IJN-NAGATO
      - IBS-U-IJN-MUTSU
      note: 第一战队（长门旗舰）
    - id: axis-screen
      role: line_ahead
      ships:
      - IBS-U-IJN-JINTSU-I
      - IBS-U-IJN-KAMIKAZE
      - IBS-U-IJN-OITE
      - IBS-U-IJN-HATSUYUKI
      note: 警戒队
    - id: axis-van
      role: line_ahead
      ships:
      - IBS-U-IJN-KAKO-I
      note: 前卫（加古；不足 2 舰由引擎并入相邻纵队）
    allies:
    - id: allies-battle-line
      role: line_ahead
      ships:
      - IBS-U-USN-COLORADO
      - IBS-U-USN-WEST-VIRGINIA
      note: 战列舰纵队
    - id: allies-screen-1
      role: line_ahead
      ships:
      - IBS-U-USN-OMAHA
      - IBS-U-USN-DAHLGREN
      - IBS-U-USN-PERRY
      note: 第一警戒队
    - id: allies-screen-2
      role: line_ahead
      ships:
      - IBS-U-USN-HULL-I
      - IBS-U-USN-BAINBRIDGE
      note: 第二警戒队

victory:
  kind: vp_with_bb_decisive_clause
  points_per_three_hull_lost: 1
  leader_margin: 4
  draw_if_margin_below: 4
  evaluated_at: end_of_turn_9
special_rules:
  - {id: IBS-S-12-R1, text: 双方都对第一次接触很震惊，双方第一回合都无法炮击和发射鱼雷。}
  # 胜利条件附加条（schema 无战列舰损失判定字段）
  - {id: IBS-S-12-R2, text: 如果敌方损失1-2艘战列舰，而己方无战列舰损失，视为决定性胜利。}
special_rule_kinds:
- id: IBS-S-12-R1
  kind: turn_restriction
  sides:
  - axis
  - allies
  turns:
  - 1
  actions:
  - gunnery
  - torpedo
  reason: 想定特例：双方第一回合都无法炮击和发射鱼雷

