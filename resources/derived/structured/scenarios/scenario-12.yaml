  - {id: IBS-U-IJN-KAMIKAZE, name: 神风, side: axis, template: dd-japanese-1942, position: R7, heading: 2, speed: 4, asset: 日本-DD-神风.png}
  - {id: IBS-U-IJN-OITE, name: 追风, side: axis, template: dd-japanese-1942, position: Q7, heading: 2, speed: 4, asset: 日本-DD-追风.png}
  - {id: IBS-U-IJN-HATSUYUKI, name: 初雪, side: axis, template: dd-japanese-1942, position: P6, heading: 2, speed: 4, asset: 日本-DD-初雪.png}
