  - {id: IBS-U-IJN-NAGATO, name: 长门, side: axis, template: ca-american-1942, position: N8, heading: 2, speed: 4, asset: 日本-BB-长门.png, flagship: true}
  - {id: IBS-U-IJN-MUTSU, name: 陆奥, side: axis, template: ca-american-1942, position: M8, heading: 2, speed: 4, asset: 日本-BB-陆奥.png}
