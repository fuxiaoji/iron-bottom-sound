    - id: allies-cruiser-line
      role: line_ahead
      ships:
      - IBS-U-USN-HONOLULU
      - IBS-U-RN-UNNAMED-T05-R01
      - IBS-U-USN-ST-LOUIS
      note: 巡洋舰纵列（安斯沃思少将旗舰火奴鲁鲁）
