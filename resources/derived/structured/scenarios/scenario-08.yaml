victory:
  kind: victory_points
  points_per_three_hull_lost: 1
  leader_margin: 4
  draw_if_margin_below: 4
  evaluated_at: end_of_turn_7
special_rules:
  - {id: IBS-S-08-R1, text: 将萨沃岛小地图的Y格对应放置在B26格。}
  - {id: IBS-S-08-R2, text: 将暴风雨标记放置在L5、M4、M6和O5。这些格和其相邻格立刻被暴雨影响。}
  - {id: IBS-S-08-R3, text: 日军可能受到增援。仅在第4回合开始时掷1枚骰子，如果掷到1，那么增援单位在移动阶段开始前，以任意航速全部放置在E17至U27的格子。}
  - {id: IBS-S-08-R4, text: 划掉所有增援单位的鱼雷再装填，因为它装载了额外的地面部队和物资。}
