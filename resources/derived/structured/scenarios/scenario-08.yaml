    - id: allies-van-dd
      role: line_ahead
      ships:
      - IBS-U-USN-NICHOLAS
      - IBS-U-USN-OBANNON
      - IBS-U-USN-TAYLOR
      - IBS-U-USN-RADFORD
      - IBS-U-USN-JENKINS
