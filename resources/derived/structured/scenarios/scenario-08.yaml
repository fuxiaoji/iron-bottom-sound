      role: line_ahead
      ships:
      - IBS-U-USN-RALPH-TALBOT
      - IBS-U-USN-BUCHANAN
      - IBS-U-USN-GWIN
      - IBS-U-USN-MAURY
      - IBS-U-USN-WOODWORTH
