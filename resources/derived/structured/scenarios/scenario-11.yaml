special_rules:
  # 游戏回合原文：9个回合，或所有日军单位离开地图。
  - {id: IBS-S-11-R1, text: 9个回合，或所有日军单位离开地图。}
  - {id: IBS-S-11-R2, text: 一架日军侦察机在战场内，双方所有移动命令写完之后，日军可以在地图上任意位置放置一枚照明弹。}
  - {id: IBS-S-11-R3, text: 由于之前的空袭行动，羽黑舰在划掉1点船体，且航速减少至6-5-5的状态进场。}
  # 胜利条件附加条（schema 无决定性胜利分差字段）
  - {id: IBS-S-11-R4, text: 如果差值达到20分，视为决定性胜利。}
