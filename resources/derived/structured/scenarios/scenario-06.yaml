# 注：页面写明增援必达；引擎以 1d6∈[1..6] 表达确定性到达。
id: IBS-S-06
number: 6
title: 第二次瓜达卡纳尔岛海战
date: 1942-11-15
status: playable
source: {document: scenario-book-zh.pdf, pdf_page: 6, printed_page: 7, status: verified_source}
turns: 10
visibility: {axis: 21, allies: 19}
optional_rules: []
available_optional_rules: [hidden_contacts, radar, star_shells, searchlights, malfunction_66, squalls, smoke, silhouettes, hidden_damage, blind_torpedoes]
setup:
  mode: scenario_positions
  engine_default_note: engine_default_formations 仅为真实模式直接开局的默认编队提案；一般模式与真实模式部署仍以 ships 初始位置和想定规则为权威。
  engine_default_formations:
    axis:
    - id: axis-close-screen
      role: line_ahead
      ships:
      - IBS-U-IJN-SENDAI
      - IBS-U-IJN-SHIKINAMI
      - IBS-U-IJN-URANAMI
      - IBS-U-IJN-AYANAMI
      note: 近接警戒队（川内领头；页面未标旗舰，绫波单舰侧出）
    - id: axis-main-body
      role: line_ahead
      ships:
      - IBS-U-IJN-NAGARA
      - IBS-U-IJN-SHIRAYUKI
      - IBS-U-IJN-HATSUYUKI
      - IBS-U-IJN-SAMIDARE
      - IBS-U-IJN-INAZUMA
      note: 挺身攻击队本队（史实为阿部弘毅挺身攻击队；本想定援军含雾岛，无比叡）
    allies:
    - id: allies-van-dd
      role: line_ahead
      ships:
      - IBS-U-USN-WALKE
      - IBS-U-USN-BENHAM
      - IBS-U-USN-PRESTON
      - IBS-U-USN-GWIN
      note: 前卫驱逐队（沃克上校）
    - id: allies-battle-line
      role: line_ahead
      ships:
      - IBS-U-USN-WASHINGTON
      - IBS-U-USN-SOUTH-DAKOTA
      note: 战列舰纵列（李少将旗舰华盛顿）

victory:
  kind: victory_points
  points_per_three_hull_lost: 1
  leader_margin: 4
  draw_if_margin_below: 4
  evaluated_at: end_of_turn_10
special_rules:
  - {id: IBS-S-06-R1, text: 岛屿放置：将萨沃岛小地图的X格对应放置在U6格。}
  - {id: IBS-S-06-R2, text: 第三回合日军增援以任意航速从G1至L1进入地图。“爱宕”、“高雄”、“雾岛”、“朝云”、“照月”按此顺序单纵队编队。}
