special_rules:
  - {id: IBS-S-02-R1, text: 游戏回合：9个回合，或所有日军单位离开地图。}
  - {id: IBS-S-02-R2, text: 岛屿放置：将萨沃岛小地图的X格对应放置在A-27格。}
  - {id: IBS-S-02-R3, text: 根据海军条令，美军DD必须始终维持与CL相邻。}
  - {id: IBS-S-02-R4, text: 日军可能受到增援。仅在第4回合开始时掷1枚骰子，如果掷到1或2，那么增援单位在移动阶段，以任意航速从G27至O27进入地图。“浜风”、“望月”、“三日月”按此顺序单纵队编队，划掉“浜风”的鱼雷再装填，因为它装载了额外的集装箱物资。}
