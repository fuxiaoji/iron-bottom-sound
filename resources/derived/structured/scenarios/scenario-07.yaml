  evaluated_at: end_of_turn_7
special_rules:
  - {id: IBS-S-07-R1, text: 第一回合双方都无法发射鱼雷。}
  - {id: IBS-S-07-R2, text: 游戏第7回合结束时统计胜利分。每造成3点“船体”损失，计入1分。领先5分和以上，并且同时击沉战巡BC比对方多的玩家为胜利者。其他结果为平局。}
special_rule_kinds:
- id: IBS-S-07-R1
  kind: turn_restriction
  sides:
  - axis
  - allies
  turns:
  - 1
  actions:
  - torpedo
  reason: 想定特例：第一回合双方都无法发射鱼雷

